shared_context:
  codebase_summary: >-
    agent-foundry is the byte-identical repo mirror of the live ~/.claude trees
    (skills/, agents/, workflows/). No PROJECT.md; conventions live in
    history.md / tasks.md / CLAUDE.md. New skill library conventions: slim SKILL.md
    parent with a 'Use when...' trigger description, references/ overflow, HARD-RULE
    blocks, kebab-case, cross-model-compatible wording.
  style_guide: >-
    Python: stdlib only + PyYAML (explicitly owned) for HUMAN-authored YAML;
    ALL machine/runtime state is stdlib JSON. Skill prose: cross-model-compatible.
  authoring_boundary: >-
    Author ALL files in the REPO working tree only (skills/avengers/ + the three
    upstream edits). Do NOT write to the live ~/.claude trees — a repo->live
    byte-sync is a standing user-managed step (a deferred sync is in flight; do
    not entangle). Every file needing live-sync must be listed in the completion
    report, NOT synced by the executor.
  git_policy: >-
    Leave ALL changes uncommitted in the working tree (branch feat/codex-effort-policy).
    Never commit, never push. No AI attribution anywhere.
  guard_stacks: >-
    External CLI calls the teams make AND the calls the skill itself emits must
    use these exact stacks. codex: `timeout <T> codex exec --ephemeral -s read-only
    -c model_reasoning_effort=<tier> "..." < /dev/null` (per-call pins; xhigh floor
    for challenger/ballot/arbiter seats; max for ratification arbiter calls with
    timeout 1200; the tier `high` is RETIRED and validation code MUST reject it;
    retry once on capacity). agy: `timeout 600 agy --sandbox [flags] -p "..." < /dev/null`
    (all flags BEFORE -p, advisory-only preamble, no --add-dir in v1, `git status
    --short` tripwire after any repo exposure).
  version_pins: "claude-code 2.1.207 | codex-cli 0.144.1 (gpt-5.6-sol) | agy 1.1.1"
  out_of_scope_v1: >-
    v1 code contains NO global-memory-tier loader branch and REJECTS member-memory
    paths outside ~/.claude/projects/<slug>/. Deferred: vindicated/refuted
    calibration, mid-phase interjections, repo-local config overrides, roster-editing
    UX, provider SDK/MCP abstraction, embeddings/vector retrieval.
  live_sync_actions_to_record: >-
    (recorded by executor, performed by user) 1) repo->live ~/.claude byte-sync of
    all authored files; 2) ~/.codex/skills/avengers symlink creation (WP-5).
