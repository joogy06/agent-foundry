team_plan:
  # agent-teams POLICY output (S055 Part I + Part V). Run in-context by bob; no
  # spawn performed. The main loop re-checks backend_hint.
  policy_source: "agent-teams skill (in-context, S055 Part V plan-compilation return)"
  status: "needs_main_loop"
  topology: "PIPELINE"
  parallelism_ratio: 0.2
  parallelism_kill_rule: "FIRED"
  parallelism_kill_rule_detail: >-
    independent_packages/total = 1/5 = 0.2 < 0.3 threshold. Multi-team disabled;
    strictly-serial execution mandated (agent-teams Step 1 rule: 39-70% degradation
    otherwise).
  dependency_analysis:
    connected_components: 1
    longest_chain: ["WP-1", "WP-2", "WP-3", "WP-5"]
    longest_chain_depth: 4
    independent_packages: ["WP-1"]
    latent_parallel_branch: >-
      WP-4 could run parallel to the WP-2->WP-3 spine (disjoint files:
      arbiter-synthesis.md + forge SKILL.md vs the avengers internals). NOT
      exploited - the kill rule fired, shared-file progressive enrichment
      (seat_prompt.py across WP-1/2/3; SKILL.md across WP-1/5) demands strict
      serialization, and WP-1 carries an interactive human gate.
  backend_hint: "bob-serial-exec"
  backend_rationale: >-
    All five WPs are executor:bob (canonical tree, no worktree). The preferred
    S055 flattening is the bob-serial-exec workflow: one execute-work-package
    stage per WP in topological order, then one finalize stage. parallel() over
    bob stages and worktree isolation are PROHIBITED (CB4 single-writer).
  teams:
    - id: "serial-pipeline"
      execution: "strictly-serial bob stages, one WP per stage, plan order"
      worker_agents: "none (executor:bob throughout)"
  merge_order: "n/a (no worker/worktree stages)"
  human_gates:
    - wp: "WP-1"
      kind: "stop-and-rescope value-proof gate"
      detail: >-
        After WP-1 artifacts + the live session produce a transcript and dissent
        record, the bob stage HALTs needs:{kind:user-decision}. WP-2..WP-5 must not
        proceed until the user judges the deliberation worth having. If not, STOP
        AND RE-SCOPE (design section 11) - do not continue to WP-2.
