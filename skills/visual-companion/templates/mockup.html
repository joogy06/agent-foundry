<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a1f2e; --border: #2a2f3e;
    --text: #e6e6e6; --muted: #888; --accent: #5b9bd5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem; font-family: -apple-system, system-ui, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.5; }
  .frame { max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 1.8rem; margin: 0 0 0.5rem; }
  .subtitle { color: var(--muted); margin-bottom: 2rem; }
  .mockup { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            overflow: hidden; }
  .mockup-header { background: #232838; padding: 0.75rem 1rem; color: var(--accent);
                   font-size: 0.875rem; border-bottom: 1px solid var(--border); }
  .mockup-body { padding: 2rem; min-height: 400px; }
  .mock-nav { background: #2a2f3e; padding: 0.75rem 1rem; margin-bottom: 1rem;
              color: var(--text); }
  .mock-button { background: var(--accent); color: white; border: none; padding: 0.5rem 1rem;
                 border-radius: 4px; }
  .mock-input { background: var(--panel); border: 1px solid var(--border); color: var(--text);
                padding: 0.5rem 1rem; border-radius: 4px; width: 100%; }
  .placeholder { background: #2a2f3e; border: 2px dashed var(--border); padding: 2rem;
                 text-align: center; color: var(--muted); border-radius: 4px; }
  .footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border);
            color: var(--muted); font-size: 0.875rem; }
</style>
</head>
<body>
<div class="frame">
  <h2>{{TITLE}}</h2>
  <p class="subtitle">{{SUBTITLE}}</p>
  <div class="mockup">
    <div class="mockup-header">{{MOCKUP_NAME}}</div>
    <div class="mockup-body">
      {{CONTENT}}
    </div>
  </div>
  <div class="footer">
    Visual companion · respond in terminal with feedback
  </div>
</div>
</body>
</html>
