<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a1f2e;
    --border: #2a2f3e;
    --text: #e6e6e6;
    --muted: #888;
    --accent: #5b9bd5;
    --letter: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .frame {
    max-width: 1200px;
    margin: 0 auto;
  }
  h1, h2, h3 { color: var(--text); margin-top: 0; }
  h2 { font-size: 1.8rem; margin-bottom: 0.5rem; }
  .subtitle { color: var(--muted); margin-bottom: 2rem; }
  .footer {
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.875rem;
  }
  pre.mermaid {
    background: var(--panel);
    padding: 1rem;
    border-radius: 8px;
    overflow-x: auto;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({ startOnLoad: true, theme: 'dark' });
</script>
</head>
<body>
<div class="frame">
  <h2>{{TITLE}}</h2>
  <p class="subtitle">{{SUBTITLE}}</p>
  {{CONTENT}}
  <div class="footer">
    Generated by visual-companion · respond in terminal
  </div>
</div>
</body>
</html>
