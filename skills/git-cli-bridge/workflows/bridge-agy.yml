name: bridge-agy

# ============================================================================
# git-cli-bridge — Antigravity CLI (agy) workflow
# ----------------------------------------------------------------------------
# Triggered when a client pushes a requests/**/request.md file to a session/**
# branch. Enforces SEC-2 (owner-only), SEC-12 (10 min cap), SEC-15 (triple
# self-trigger prevention), SEC-8/9/10 (pinned SHAs, --ignore-scripts, policy).
# ============================================================================

on:
  push:
    branches:
      - 'session/**'
    paths:
      - 'requests/**/request.md'

permissions:
  contents: write
  id-token: write

concurrency:
  group: bridge-agy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10                                                   # SEC-12

    # SEC-2 + M15 triple layer (author gate + commit marker + path filter above)
    if: |
      github.actor == github.repository_owner &&
      !contains(github.event.head_commit.message, '[bridge-response]')

    steps:
      - name: Checkout session branch
        # SEC-9: pin by commit SHA (placeholder — reviewer must update with
        # the current actions/checkout@v4 SHA before first use).
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3  # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect tool from request frontmatter
        id: detect
        run: |
          set -euo pipefail
          REQ_DIR="$(git diff --name-only HEAD^ HEAD | grep '^requests/.*/request\.md$' | head -1 | xargs -r dirname || true)"
          if [ -z "${REQ_DIR:-}" ]; then
            echo "no request.md in this push"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOOL="$(yq '.tool' "$REQ_DIR/request.md")"
          echo "req_dir=$REQ_DIR" >> "$GITHUB_OUTPUT"
          echo "tool=$TOOL"       >> "$GITHUB_OUTPUT"
          echo "skip=false"       >> "$GITHUB_OUTPUT"

      - name: Skip if not an agy request
        if: steps.detect.outputs.skip == 'true' || steps.detect.outputs.tool != 'agy'
        run: echo "This push is not an agy request; bridge-copilot will handle it if applicable."

      - name: Validate request schema
        if: steps.detect.outputs.tool == 'agy'
        run: .github/scripts/validate-request.sh "${{ steps.detect.outputs.req_dir }}"

      # TODO(agy): validate agy install/run on the GitHub Actions runner.
      # agy authenticates via the Antigravity account (config under
      # ~/.antigravity/), NOT via GCP Workload Identity Federation / Vertex AI.
      # The previous WIF auth step was gemini-Vertex specific and has no
      # verified agy analogue. The local call layer uses no API-key env var;
      # determine how the runner supplies Antigravity credentials before
      # enabling this path.
      - name: Authenticate agy on runner (TODO — Antigravity account creds)
        if: steps.detect.outputs.tool == 'agy'
        id: auth
        run: |
          echo "TODO(agy): supply Antigravity-account credentials to agy on the runner."

      - name: Set BRIDGE_CANARY (M6)
        if: steps.detect.outputs.tool == 'agy'
        run: echo "BRIDGE_CANARY=$(uuidgen)" >> "$GITHUB_ENV"

      # TODO(agy): validate agy install/run on the GitHub Actions runner.
      # agy ships as the `agy` binary at ~/.local/bin/agy (Antigravity CLI
      # 1.0.4), NOT as an npm package, so the pinned-npm + --ignore-scripts +
      # integrity-lock supply-chain controls (M8/M9) do not apply unchanged.
      # Confirm a pinned, integrity-verified install method for agy on the
      # runner before enabling this path.
      - name: Install agy (TODO — pin + integrity-verify install method)
        if: steps.detect.outputs.tool == 'agy'
        run: |
          set -euo pipefail
          echo "TODO(agy): validate agy install/run on the GitHub Actions runner."

      - name: Process request
        if: steps.detect.outputs.tool == 'agy'
        env:
          BRIDGE_CANARY: ${{ env.BRIDGE_CANARY }}
        run: .github/scripts/process-request.sh "${{ steps.detect.outputs.req_dir }}" agy

      - name: Commit and push response
        if: steps.detect.outputs.tool == 'agy' && always()
        run: |
          set -euo pipefail
          git config user.name  "bridge-bot"
          git config user.email "bridge-bot@users.noreply.github.com"
          REQ_DIR='${{ steps.detect.outputs.req_dir }}'
          git add "$REQ_DIR/status.json" 2>/dev/null || true
          git add "$REQ_DIR/response.md" 2>/dev/null || true
          git add "$REQ_DIR/error.md"    2>/dev/null || true
          git add "$REQ_DIR/logs/"       2>/dev/null || true
          REQ_ID="$(basename "$REQ_DIR")"
          git commit -m "bridge: response for $REQ_ID [bridge-response]" || {
            echo "nothing to commit"; exit 0;
          }
          git push origin HEAD:${{ github.ref }}
