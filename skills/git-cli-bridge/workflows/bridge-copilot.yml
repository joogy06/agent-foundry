name: bridge-copilot

# ============================================================================
# git-cli-bridge — Copilot workflow
# ----------------------------------------------------------------------------
# Same trigger and self-trigger defenses as bridge-agy.yml.
# Differences: fetches COPILOT_GITHUB_TOKEN from GCP Secret Manager via WIF,
# installs @github/copilot@1.0.21, invokes with narrow --allow-tool scoping.
# ============================================================================

on:
  push:
    branches:
      - 'session/**'
    paths:
      - 'requests/**/request.md'

permissions:
  contents: write
  id-token: write

concurrency:
  group: bridge-copilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10                                                   # SEC-12

    if: |
      github.actor == github.repository_owner &&
      !contains(github.event.head_commit.message, '[bridge-response]')

    steps:
      - name: Checkout session branch
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3  # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect tool from request frontmatter
        id: detect
        run: |
          set -euo pipefail
          REQ_DIR="$(git diff --name-only HEAD^ HEAD | grep '^requests/.*/request\.md$' | head -1 | xargs -r dirname || true)"
          if [ -z "${REQ_DIR:-}" ]; then
            echo "no request.md in this push"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOOL="$(yq '.tool' "$REQ_DIR/request.md")"
          echo "req_dir=$REQ_DIR" >> "$GITHUB_OUTPUT"
          echo "tool=$TOOL"       >> "$GITHUB_OUTPUT"
          echo "skip=false"       >> "$GITHUB_OUTPUT"

      - name: Skip if not a copilot request
        if: steps.detect.outputs.skip == 'true' || steps.detect.outputs.tool != 'copilot'
        run: echo "This push is not a copilot request; bridge-agy will handle it if applicable."

      - name: Validate request schema
        if: steps.detect.outputs.tool == 'copilot'
        run: .github/scripts/validate-request.sh "${{ steps.detect.outputs.req_dir }}"

      - name: Authenticate to GCP (WIF — for Secret Manager)
        if: steps.detect.outputs.tool == 'copilot'
        id: auth
        uses: google-github-actions/auth@a0df0a39c6a3e59ef4f3a7f0a4a6de2d3d2e99a3  # v2.1.8
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Fetch Copilot PAT from Secret Manager
        if: steps.detect.outputs.tool == 'copilot'
        id: secrets
        # v2.2.2 equivalent SHA (placeholder — reviewer updates)
        uses: google-github-actions/get-secretmanager-secrets@50ab02f77b8cd432f9e33d4da5edf05f49fc57ed  # v2.2.2
        with:
          secrets: |
            COPILOT_GITHUB_TOKEN:${{ vars.GOOGLE_CLOUD_PROJECT }}/copilot-bridge-pat

      - name: Set BRIDGE_CANARY (M6)
        if: steps.detect.outputs.tool == 'copilot'
        run: echo "BRIDGE_CANARY=$(uuidgen)" >> "$GITHUB_ENV"

      - name: Install @github/copilot@1.0.21 (M8 + M9)
        if: steps.detect.outputs.tool == 'copilot'
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @github/copilot@1.0.21
          .github/scripts/verify-integrity.sh @github/copilot 1.0.21

      - name: Process request
        if: steps.detect.outputs.tool == 'copilot'
        env:
          COPILOT_GITHUB_TOKEN: ${{ steps.secrets.outputs.COPILOT_GITHUB_TOKEN }}
          BRIDGE_CANARY: ${{ env.BRIDGE_CANARY }}
        run: .github/scripts/process-request.sh "${{ steps.detect.outputs.req_dir }}" copilot

      - name: Commit and push response
        if: steps.detect.outputs.tool == 'copilot' && always()
        run: |
          set -euo pipefail
          git config user.name  "bridge-bot"
          git config user.email "bridge-bot@users.noreply.github.com"
          REQ_DIR='${{ steps.detect.outputs.req_dir }}'
          git add "$REQ_DIR/status.json" 2>/dev/null || true
          git add "$REQ_DIR/response.md" 2>/dev/null || true
          git add "$REQ_DIR/error.md"    2>/dev/null || true
          git add "$REQ_DIR/logs/"       2>/dev/null || true
          REQ_ID="$(basename "$REQ_DIR")"
          git commit -m "bridge: response for $REQ_ID [bridge-response]" || {
            echo "nothing to commit"; exit 0;
          }
          git push origin HEAD:${{ github.ref }}
