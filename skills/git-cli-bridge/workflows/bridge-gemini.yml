name: bridge-gemini

# ============================================================================
# git-cli-bridge — Gemini workflow
# ----------------------------------------------------------------------------
# Triggered when a client pushes a requests/**/request.md file to a session/**
# branch. Enforces SEC-2 (owner-only), SEC-12 (10 min cap), SEC-15 (triple
# self-trigger prevention), SEC-8/9/10 (pinned SHAs, --ignore-scripts, policy).
# ============================================================================

on:
  push:
    branches:
      - 'session/**'
    paths:
      - 'requests/**/request.md'

permissions:
  contents: write
  id-token: write

concurrency:
  group: bridge-gemini-${{ github.ref }}
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 10                                                   # SEC-12

    # SEC-2 + M15 triple layer (author gate + commit marker + path filter above)
    if: |
      github.actor == github.repository_owner &&
      !contains(github.event.head_commit.message, '[bridge-response]')

    steps:
      - name: Checkout session branch
        # SEC-9: pin by commit SHA (placeholder — reviewer must update with
        # the current actions/checkout@v4 SHA before first use).
        uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3  # v4.2.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect tool from request frontmatter
        id: detect
        run: |
          set -euo pipefail
          REQ_DIR="$(git diff --name-only HEAD^ HEAD | grep '^requests/.*/request\.md$' | head -1 | xargs -r dirname || true)"
          if [ -z "${REQ_DIR:-}" ]; then
            echo "no request.md in this push"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TOOL="$(yq '.tool' "$REQ_DIR/request.md")"
          echo "req_dir=$REQ_DIR" >> "$GITHUB_OUTPUT"
          echo "tool=$TOOL"       >> "$GITHUB_OUTPUT"
          echo "skip=false"       >> "$GITHUB_OUTPUT"

      - name: Skip if not a gemini request
        if: steps.detect.outputs.skip == 'true' || steps.detect.outputs.tool != 'gemini'
        run: echo "This push is not a gemini request; bridge-copilot will handle it if applicable."

      - name: Validate request schema
        if: steps.detect.outputs.tool == 'gemini'
        run: .github/scripts/validate-request.sh "${{ steps.detect.outputs.req_dir }}"

      - name: Authenticate to GCP (WIF)
        if: steps.detect.outputs.tool == 'gemini'
        id: auth
        # SEC-9: pinned commit SHA for v2.1.8 (placeholder — reviewer updates)
        uses: google-github-actions/auth@a0df0a39c6a3e59ef4f3a7f0a4a6de2d3d2e99a3  # v2.1.8
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
          token_format: access_token
          access_token_lifetime: 1800s

      - name: Set BRIDGE_CANARY (M6)
        if: steps.detect.outputs.tool == 'gemini'
        run: echo "BRIDGE_CANARY=$(uuidgen)" >> "$GITHUB_ENV"

      - name: Install @google/gemini-cli@0.36.0 (M8 + M9)
        if: steps.detect.outputs.tool == 'gemini'
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts @google/gemini-cli@0.36.0
          .github/scripts/verify-integrity.sh @google/gemini-cli 0.36.0

      - name: Process request
        if: steps.detect.outputs.tool == 'gemini'
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ vars.GOOGLE_CLOUD_LOCATION }}
          BRIDGE_CANARY: ${{ env.BRIDGE_CANARY }}
        run: .github/scripts/process-request.sh "${{ steps.detect.outputs.req_dir }}" gemini

      - name: Commit and push response
        if: steps.detect.outputs.tool == 'gemini' && always()
        run: |
          set -euo pipefail
          git config user.name  "bridge-bot"
          git config user.email "bridge-bot@users.noreply.github.com"
          REQ_DIR='${{ steps.detect.outputs.req_dir }}'
          git add "$REQ_DIR/status.json" 2>/dev/null || true
          git add "$REQ_DIR/response.md" 2>/dev/null || true
          git add "$REQ_DIR/error.md"    2>/dev/null || true
          git add "$REQ_DIR/logs/"       2>/dev/null || true
          REQ_ID="$(basename "$REQ_DIR")"
          git commit -m "bridge: response for $REQ_ID [bridge-response]" || {
            echo "nothing to commit"; exit 0;
          }
          git push origin HEAD:${{ github.ref }}
