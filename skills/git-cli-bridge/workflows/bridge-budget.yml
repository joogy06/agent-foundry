name: bridge-budget

# Monthly budget report. Runs day 1/15/28, opens a GitHub issue with current
# Actions minutes. Flags [ALERT] when above vars.BRIDGE_BUDGET_ALERT_MIN
# (default 4000). Per user ruling B4 — monitoring only, no hard cap.

on:
  schedule:
    - cron: '0 6 1,15,28 * *'
  workflow_dispatch: {}

permissions:
  issues: write
  actions: read

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch Actions billing
        id: billing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MIN="$(gh api repos/${{ github.repository }}/actions/billing/usage --jq .total_minutes_used 2>/dev/null || echo 0)"
          echo "minutes=$MIN" >> "$GITHUB_OUTPUT"

      - name: Post budget issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          THRESHOLD="${{ vars.BRIDGE_BUDGET_ALERT_MIN }}"
          THRESHOLD="${THRESHOLD:-4000}"
          MIN="${{ steps.billing.outputs.minutes }}"
          TAG="[status]"
          if [ "${MIN:-0}" -gt "$THRESHOLD" ]; then
            TAG="[ALERT]"
          fi
          TITLE="$TAG bridge budget $(date -u +%Y-%m-%d): ${MIN} min used"
          BODY=$(cat <<EOF
          Actions minutes this cycle: ${MIN}
          Configured threshold (vars.BRIDGE_BUDGET_ALERT_MIN): ${THRESHOLD}

          This issue is auto-generated by bridge-budget.yml. Monitoring only —
          no hard cap is enforced. See references/operations.md §3 for response
          procedures if this is flagged [ALERT].
          EOF
          )
          gh issue create --title "$TITLE" --body "$BODY" --label bridge-budget || true
