name: bridge-maintenance

# Scheduled prune of stale session branches. See references/workflows.md §4.
# Runs on the bridge repo's `main` branch; never touches session branches
# with in-flight `running` requests (M17).

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: vars.BRIDGE_MAINTENANCE_DISABLED != 'true'
    steps:
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3  # v4.2.2
        with:
          fetch-depth: 0

      - name: Fetch all session refs
        run: git fetch origin '+refs/heads/session/*:refs/remotes/origin/session/*'

      - name: Prune stale sessions (>7d) with running-state guard
        run: |
          set -euo pipefail
          THRESHOLD_DAYS=7
          ARCHIVE_RETENTION_DAYS=60
          NOW=$(date +%s)
          CUTOFF=$((NOW - THRESHOLD_DAYS * 86400))

          git config user.name  "bridge-bot"
          git config user.email "bridge-bot@users.noreply.github.com"

          while IFS=' ' read -r ct ref; do
            [ -z "${ref:-}" ] && continue
            if [ "$ct" -ge "$CUTOFF" ]; then
              continue
            fi
            branch="${ref#refs/remotes/origin/}"
            # Running-state guard (M17): skip if any status.json is running.
            skip=0
            for f in $(git ls-tree -r --name-only "origin/$branch" -- requests/ 2>/dev/null | grep '/status\.json$' || true); do
              if git show "origin/$branch:$f" 2>/dev/null | jq -e '.state == "running"' >/dev/null 2>&1; then
                skip=1
                break
              fi
            done
            if [ "$skip" -eq 1 ]; then
              echo "skip $branch (running request present)"
              continue
            fi

            sid="${branch#session/}"
            date_suffix="$(date -u -d "@$ct" +%Y%m%d 2>/dev/null || date -u -r "$ct" +%Y%m%d 2>/dev/null)"
            tag="archive/session/${sid}-${date_suffix}"

            echo "archiving+deleting $branch -> $tag"
            git tag -f "$tag" "origin/$branch"
            git push origin "$tag"
            git push origin --delete "$branch" || true
            git commit --allow-empty -m "bridge: archive session $sid [skip ci]" || true
          done < <(git for-each-ref --format='%(committerdate:unix) %(refname)' refs/remotes/origin/session/* || true)

          # Prune archive tags older than retention window.
          for t in $(git tag --list 'archive/session/*'); do
            when=$(git log -1 --format=%ct "$t" 2>/dev/null || echo 0)
            if [ "$when" -gt 0 ] && [ $((NOW - when)) -ge $((ARCHIVE_RETENTION_DAYS * 86400)) ]; then
              git tag -d "$t" || true
              git push origin ":refs/tags/$t" || true
            fi
          done
