<!doctype html>
<html>
<head>
<style>
  :root { --accent-sun: #ffd23f; --ink: #0a0a0a; }
  body { margin: 0; }
  .card-sunny { background: var(--accent-sun); color: var(--ink); padding: 12px; border: 2px solid var(--ink); }
</style>
</head>
<body>
  <article class="card-sunny" id="sunny-card" role="article" data-test-id="sunny">
    <button id="action" type="button">Sunny action</button>
  </article>
</body>
</html>
