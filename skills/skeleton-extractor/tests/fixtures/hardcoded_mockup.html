<!doctype html>
<html>
<head>
<style>
  :root { --accent-sun: #ffd23f; --ink: #0a0a0a; }
  body { margin: 0; }
  .wrong-banner { background: #ac3b3b; color: #ffffff; padding: 10px; border: 2px solid #0a0a0a; }
  button { background: var(--accent-sun); color: var(--ink); padding: 8px; }
</style>
</head>
<body>
  <section class="wrong-banner" id="wrong" role="alert" data-test-id="wrong">
    <button id="dismiss" type="button">Dismiss</button>
  </section>
</body>
</html>
