# avengers composition profile (DATA). Design §7.
# Family: research-synthesis — ratify a set of research claims / findings against
# a stated incumbent understanding. RATIFICATION convergence via cross-cli Gate-1
# null-hypothesis ballots (like coding-ratification, applied to CLAIMS not code).
# GROUNDING REQUIRED: no claim may carry confidence above 'speculative' without
# external grounding, and the arbiter refuses to invent findings.
# Closed primitive vocabulary; an unknown primitive is a fail-closed validate
# error in convene.py. This file is DATA — nothing here is executed.
schema: avengers-profile.v1
family: research-synthesis
description: >
  Ratify or refute a synthesis of research claims against a stated incumbent
  premise. The skeptic (adversary) attacks each claim's grounding and tries to
  falsify it; the architect synthesizes for coherence; the operator tests whether
  the claim holds in practice. The arbiter (never the adversary's provider)
  returns a single ratified synthesis plus a mandatory attributed dissent record;
  every surviving claim is grounded, and ungrounded claims are capped at
  'speculative' confidence.

# --- Roster resolution (refs into roster/<seat_id>.yaml) ---
seats:
  - ref: skeptic
    provider: codex
    effort: xhigh            # pinned challenger floor; NEVER 'high'
    adversarial_role: true
  - ref: architect
    provider: claude
    effort: default
  - ref: operator
    provider: agy
    effort: default

arbiter:
  prefer: architect          # claude; provider != skeptic(codex) adversary
  provider_must_not_equal_adversarial: true
  effort_on_codex: max        # ratification arbiter on codex pins 'max' (timeout 1200) — defensive

# --- Phase parameters (design §4) ---
phases:
  blind_diverge: true
  docket:
    max_issues: 6
  cross_exam:
    max_cycles: 1
    max_new_challenges_per_seat_per_cycle: 2
    stalemate_unchanged_exchanges: 2
  converge:
    semantics: ratification    # cross-cli Gate-1 null-hypothesis ballots (private), applied to claims
    ballot_options: [ACCEPT_AS_IS, CHANGE_NEEDED, REJECT_PREMISE]
    change_needed_requires_evidence: true

# --- Grounding & arbiter rules (design §4 ARBITER) ---
grounding:
  required: true             # every surviving claim must cite external grounding
  no_confidence_above_speculative_without_external_grounding: true
  no_invention_of_novel_claims: true
  min_trip_wires_on_decision: 2
  dissent_record: mandatory

# --- Outcome routing (design §8) ---
outcome:
  type: [decision, deliverable]
  default: decision
  template: outcome/decision-record.md

# --- Sensitivity & memory policy ---
sensitivity:
  pii: false
  retain: full
memory:
  tier: project
  writeback: on

# --- Budgets (design §4/§7) ---
budgets:
  max_seat_calls: 10
  wall_clock_s: 900
  max_cycles: 1
