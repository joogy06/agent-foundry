# avengers composition profile (DATA). Design §7.
# Family: coding-ratification — ratify a proposal/decision against a stated
# incumbent premise. Convergence via cross-cli Gate-1 null-hypothesis ballots.
# Closed primitive vocabulary; an unknown primitive is a fail-closed validate
# error in convene.py (WP-2). This file is DATA — nothing here is executed.
schema: avengers-profile.v1
family: coding-ratification
description: >
  Ratification of a coding / architecture / policy decision. A designated
  adversary (skeptic) tries to falsify the proposal on its own terms; the
  architect and operator supply the countervailing incentives; the steward
  (principal-proxy) holds the outcome to the requester's stated intent and
  pushes on drift (design §5); the EXTERNAL cold-context arbiter (never a
  deliberation-seat provider on the clean path) synthesizes a single decision
  plus a mandatory attributed dissent record with actionable trip-wires.
  Four deliberation seats + the external arbiter (within the 4-6 evidence band).

# --- Roster resolution (refs into roster/<seat_id>.yaml) ---
# Per-seat provider/effort overrides are permitted only WITHIN policy
# (convene.py rejects retired tiers such as 'high'). >=1 seat MUST resolve
# adversarial_role: true. The EXTERNAL seatless arbiter's provider MUST differ
# from every DELIBERATION seat's provider on the clean path (widened from
# adversarial-only, design §4); coding-ratification pins all three families so
# it always lands on the fallback path -> the strongest non-adversarial provider
# (claude), authorship anonymized with an accepted, flagged residual (§6a).
seats:
  - ref: skeptic
    provider: codex
    effort: xhigh            # pinned challenger floor; NEVER 'high'
    adversarial_role: true   # explicit; also declared on the identity card
  - ref: architect
    provider: claude
    effort: default
  - ref: operator
    provider: agy
    effort: default
  - ref: steward
    provider: agy            # design §5: affinity agy keeps the fallback arbiter on
    effort: default          # claude sharing a provider with only ONE ideator (architect)
    adversarial_role: false  # principal-proxy: pushes on drift, does NOT decide/arbitrate

arbiter:
  # v2 (design §4): the arbiter is an EXTERNAL, SEATLESS, cold-context CALL — a
  # fresh persona-free synthesis over ALL positions (authorship-anonymized), NOT
  # a promoted seat. NO seat both ballots and adjudicates (participant-judge
  # violation gone). The resolver SELECTS the provider (never inherits it from a
  # seat): a provider used by no deliberation seat = CLEAN path (no residual),
  # else the strongest adjudication-prior NON-adversarial provider cold-context =
  # FALLBACK path. Here {codex,claude,agy} all deliberate -> fallback -> claude,
  # and run-record.json sets fallback_arbiter_residual: true. All-adversarial is
  # the ONLY unsatisfiable case -> fail CLOSED (ConveneError, no run, no spend).
  # `can_arbitrate` on the seats is INERT under v2. The old `prefer` /
  # `provider_must_not_equal_adversarial` keys are RETIRED — the external
  # algorithm supersedes them; only `effort_on_codex` below is still consumed.
  effort_on_codex: max        # codex-arbiter edge case ONLY (moot here: codex is the excluded adversary). IF an arbiter ever resolves to codex: ratification_arbiter seat-class -> 'max' (timeout 1200)

# --- Phase parameters (design §4) ---
phases:
  blind_diverge: true         # identity + standing memory only; no peers, no episodics
  docket:
    max_issues: 6
  cross_exam:
    max_cycles: 1             # canonical cycle-budget name everywhere; default depth
    max_new_challenges_per_seat_per_cycle: 2
    stalemate_unchanged_exchanges: 2   # INTERNAL counter, distinct from max_cycles
  converge:
    semantics: ratification    # cross-cli Gate-1 null-hypothesis ballots (private)
    ballot_options: [ACCEPT_AS_IS, CHANGE_NEEDED, REJECT_PREMISE]
    change_needed_requires_evidence: true

# --- Grounding & arbiter rules (design §4 ARBITER) ---
grounding:
  no_confidence_above_speculative_without_external_grounding: true
  min_trip_wires_on_decision: 2
  dissent_record: mandatory   # attribution + convergence margin (unanimous / converged N-M / arbiter broke tie)

# --- Outcome routing (design §8) ---
outcome:
  type: [decision, forge_brief]   # ratification exits as a decision, or a forge_brief on the build path
  default: decision
  template: outcome/decision-record.md

# --- Sensitivity & memory policy ---
sensitivity:
  pii: false
  retain: full
memory:
  tier: project               # v1: project only. NO global-tier loader branch (design §2/§14).
  writeback: on               # gated, default-reject per item (WP-3)

# --- Budgets (design §4/§7) ---
budgets:
  # WP-3: 4 deliberation seats (skeptic + architect + operator + steward) + external
  # arbiter -> ~13 = 4 diverge + 4 cross-exam + 4 converge + 1 arbiter, so no phase is
  # truncated by the cap (design §7). WP-5 does the final dry-run-clean capstone.
  max_seat_calls: 13
  wall_clock_s: 900           # target <10 min
  max_cycles: 1
